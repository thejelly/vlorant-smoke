<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>无畏契约 · 烟雾点位指南</title>
  <meta name="description" content="VALORANT 各地图进攻方与防守方烟雾点位速查指南" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1 class="logo">无畏契约 <span>烟雾点位指南</span></h1>
      <p class="tagline">选择地图与阵营,查看常用下烟点位</p>
    </div>
  </header>

  <main class="container">
    <!-- 地图选择 -->
    <section class="controls">
      <div class="control-group">
        <label class="control-label">地图</label>
        <div id="map-tabs" class="map-tabs" role="tablist" aria-label="地图选择"></div>
      </div>

      <div class="control-group">
        <label class="control-label">阵营</label>
        <div class="side-toggle" role="tablist" aria-label="阵营选择">
          <button class="side-btn is-active" data-side="attack" role="tab" aria-selected="true">
            ⚔️ 进攻方
          </button>
          <button class="side-btn" data-side="defense" role="tab" aria-selected="false">
            🛡️ 防守方
          </button>
        </div>
      </div>

      <div class="control-group">
        <label class="control-label">视图</label>
        <div class="view-toggle" role="tablist" aria-label="视图选择">
          <button class="view-btn is-active" data-view="2d" role="tab" aria-selected="true">
            🗺️ 2D 平面
          </button>
          <button class="view-btn" data-view="3d" role="tab" aria-selected="false">
            🧊 3D 立体
          </button>
        </div>
      </div>
    </section>

    <!-- 主体:示意图 + 点位列表 -->
    <section class="content">
      <div class="map-panel">
        <div class="map-panel-header">
          <h2 id="map-title">—</h2>
          <span id="side-badge" class="side-badge attack">进攻方</span>
        </div>
        <div id="map-diagram" class="map-diagram" aria-label="点位示意图">
          <!-- 点位标记由脚本注入 -->
        </div>
        <div id="map-3d" class="map-3d" aria-label="3D 立体地图" hidden>
          <button id="reset-3d" class="map3d-btn" type="button" title="复位视角">⟲ 复位视角</button>
          <!-- three.js 画布由脚本注入 -->
        </div>
        <p id="hint-2d" class="diagram-hint">游戏官方小地图俯视图,橙/蓝色编号标记为下烟点位。点击标记或右侧列表查看详情。</p>
        <p id="hint-3d" class="diagram-hint" hidden>立体沙盘:烟柱为下烟点位(橙=进攻 / 蓝=防守)。拖动旋转 · 滚轮缩放 · 右键平移,点击烟柱或右侧列表查看详情。</p>
      </div>

      <div class="list-panel">
        <div class="list-header">
          <h2>点位列表</h2>
          <span id="spot-count" class="count-badge">0</span>
        </div>
        <ul id="spot-list" class="spot-list"></ul>
      </div>
    </section>
  </main>

  <div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>

  <footer class="site-footer">
    <p>点位为常见通用示意,仅供参考学习。地图图片为 Riot Games 官方素材(经 VALORANT_DDragon 镜像)。VALORANT 为 Riot Games 商标,本页面非营利、与 Riot 无官方关联。</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>

  <!-- 3D 视图(three.js,本地 vendor,支持离线) -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js",
        "three/addons/": "./vendor/jsm/"
      }
    }
  </script>
  <script type="module" src="three-view.js"></script>
</body>
</html>
